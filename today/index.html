.today .meta{font-size:13px;color:var(--t3);margin:0 0 14px}
.btn{display:inline-block;border-radius:999px;padding:8px 20px;background:var(--brand-1);color:#fff;font-weight:600;font-size:14px}
html.dark .btn{color:#1b1b1f}
.btn:hover{text-decoration:none;background:var(--brand-2)}
.ctx{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ctx a{display:flex;flex-direction:column;gap:2px;padding:14px 14px;border:1px solid var(--divider);background:var(--bg-elv);border-radius:12px;color:var(--t1);box-shadow:var(--shadow);transition:border-color .2s}

.ctx small{color:var(--t3);font-size:12px;line-height:1.5}
form.s{display:flex;gap:8px}
form.s input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--divider);background:var(--bg-alt);font-size:15px}

form.s button{height:44px;padding:0 20px;border-radius:10px;border:0;background:var(--brand-1);color:#fff;font-weight:600;cursor:pointer}
html.dark form.s button{color:#1b1b1f}
.disclaimer{padding:10px 14px;border:1px solid var(--divider);border-radius:8px;background:var(--bg-alt);color:var(--t2);font-size:13px;line-height:1.7}
.foot{color:var(--t3);font-size:13px}
.top{order:-3}header{order:-2}.wrap.nodata #sec-search{order:-1}
@media (max-width:560px){.ctx{grid-template-columns:1fr}h1{font-size:23px}}

<script>
(function(){
  // 搜尋：跳回首頁並帶 #q=
  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var q = document.getElementById('q').value.trim();
    location.href = q ? '../#q=' + encodeURIComponent(q) : '../';
  });
  // 今日這條：data/today.json 格式 {id,title,summary,date}；讀不到就只顯示搜尋框
  var wrap = document.getElementById('wrap');
  fetch('../data/today.json', { cache:'no-cache' }).then(function(r){
    if (!r.ok) throw new Error(r.status); return r.json();
  }).then(function(d){
    if (!d || typeof d.title !== 'string' || typeof d.id !== 'string' || !/^tw-[a-z0-9]+(?:-[a-z0-9]+)*$/.test(d.id)) throw new Error('bad');
    document.getElementById('t-title').textContent = d.title;
    document.getElementById('t-sum').textContent = d.summary || '';
    document.getElementById('t-sum').hidden = !d.summary;
    document.getElementById('t-meta').textContent = d.date ? '更新日期 ' + d.date : '';
    document.getElementById('t-meta').hidden = !d.date;
    document.getElementById('t-link').href = '../e/' + d.id + '/';
    document.getElementById('sec-today').hidden = false;
  }).catch(function(){ wrap.classList.add('nodata'); });
})();
</script>
